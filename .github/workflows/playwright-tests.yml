name: FashionHub Playwright Tests

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chromium]
        env: [local, staging, prod]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-json-report

      # ✅ Install ONLY chromium
      - name: Install Playwright browser (chromium only)
        run: playwright install --with-deps ${{ matrix.browser }}

      # ✅ Run tests + generate JSON report
      - name: Run tests and generate report
        env:
          ENV: ${{ matrix.env }}
        run: |
          pytest --browser=${{ matrix.browser }} \
                 --json-report \
                 --json-report-file=report.json

      # ✅ Convert JSON → Markdown
      - name: Generate Markdown report
        run: python generate_report.py

      # ✅ Publish to GitHub Wiki
      - name: Publish results to Wiki
        run: |
          git clone https://github.com/${{ github.repository }}.wiki.git
          cd $(basename ${{ github.repository }}).wiki

          cp ../RESULTS.md Test-Results.md

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Update test results" || echo "No changes"
          git push